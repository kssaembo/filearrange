name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
        run: |
          $testTemp = Join-Path $env:GITHUB_WORKSPACE "_test_temp"
          New-Item -ItemType Directory -Force -Path $testTemp | Out-Null
          $env:TEMP = $testTemp
          $env:TMP = $testTemp
          python -m unittest discover -s tests -v

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean SafeFileOrganizer.spec

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SafeFileOrganizer-Windows-x64
          path: |
            dist/SafeFileOrganizer.exe
            README_KO.md
          if-no-files-found: error
